apiVersion: apps/v1
kind: Deployment
metadata:
  name: lubelogger-app
  namespace: lubelogger
  labels:
    app.kubernetes.io/name: lubelogger
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: lubelogger
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lubelogger
      app.kubernetes.io/component: app
      app.kubernetes.io/part-of: lubelogger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lubelogger
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: lubelogger
    spec:
      automountServiceAccountToken: false
      runtimeClassName: kata-qemu-runtime-rs
      terminationGracePeriodSeconds: 30
      # Kata capable nodes only
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: kata-containers.io
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: lubelogger
                    app.kubernetes.io/part-of: lubelogger
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lubelogger
              app.kubernetes.io/part-of: lubelogger
      containers:
        - name: lubelogger
          image: ghcr.io/hargata/lubelogger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: lubelogger-config
            - secretRef:
                name: postgres-auth
            - secretRef:
                name: lubelogger-bootstrap-auth
          env:
            - name: LUBELOGGER_AUTO_EVENTS
              value: "false"
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 15
          volumeMounts:
            - name: lubelogger-data
              mountPath: /App/data
            - name: lubelogger-keys
              mountPath: /root/.aspnet/DataProtection-Keys
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: lubelogger-data
          persistentVolumeClaim:
            claimName: lubelogger-data
        - name: lubelogger-keys
          persistentVolumeClaim:
            claimName: lubelogger-keys
